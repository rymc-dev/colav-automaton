[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colav-automaton"
dynamic = ["version"]
description = "Maritime collision-avoidance hybrid automaton built on hybrid-automaton, using risk envelopes for waypoint generation."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["colav", "maritime", "autonomy", "robotics", "hybrid-automaton", "waypoint-generation"]
authors = [
  { name = "Ryan McKee", email = "ryanmckee47@icloud.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "hybrid-automaton>=1.0.0",
  "shapely",
  "riskenv>=1.0.0",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-mock",
]

[project.urls]
Documentation = "https://github.com/rymc-dev/colav-automaton#readme"
Issues = "https://github.com/rymc-dev/colav-automaton/issues"
Source = "https://github.com/rymc-dev/colav-automaton"

[tool.hatch.version]
path = "src/colav_automaton/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/colav_automaton src/colav_automaton_evaluation tests}"

[tool.coverage.run]
source_pkgs = ["colav_automaton", 'colav_automaton_evaluation', "tests"]
branch = true
parallel = true
omit = [
  "src/colav_automaton/__about__.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colav_automaton", "src/colav_automaton_evaluation"]

[tool.coverage.paths]
colav_automaton = ["src/colav_automaton", "*/colav-automaton/src/colav_automaton"]
colav_autmoaton_evaluations = ["src/colav_automaton_evaluation", "*/colav-automaton/src/colav_automaton_evaluation"]
tests = ["tests", "*/colav-automaton/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
