[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colav-automaton"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Ryan McKee", email = "ryanmckee47@icloud.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Ryan McKee/colav-automaton#readme"
Issues = "https://github.com/Ryan McKee/colav-automaton/issues"
Source = "https://github.com/Ryan McKee/colav-automaton"

[tool.hatch.version]
path = "src/colav_automaton/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/colav_automaton tests}"

[tool.coverage.run]
source_pkgs = ["colav_automaton", "tests"]
branch = true
parallel = true
omit = [
  "src/colav_automaton/__about__.py",
]

[tool.coverage.paths]
colav_automaton = ["src/colav_automaton", "*/colav-automaton/src/colav_automaton"]
tests = ["tests", "*/colav-automaton/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
